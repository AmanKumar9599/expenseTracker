<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="expense.css">
</head>
<body>
    <div class="container">
        <div class="head">
            <h1>Expense Tracker</h1>
        </div>
        <div class="options">
            <form id="form">
                <input type="text" placeholder="Expense Description" id="desc">
                <br>
                <select name="cateogary" id="cateogary">
                    <option value="">Select Cateogary</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Food">Food</option>
                    <option value="Transportation">Transportation</option>
                    <option value="Utility">Utility</option>
                    <option value="Others">Others</option>
                </select>
                <br>
                <input type="number" placeholder="Amount" id="amount">
                <br>
                <input type="submit" value="Add Expense" id="button">
            </form>

        </div>
        <h3>Expense Summary</h3>
        <table>
            <thead>
                <tr>
                    <th>Description</th>
                    <th>Cateogary</th>
                    <th>Amount</th>
                </tr>
            </thead>
            <tbody id="data"></tbody>
        </table>
        <input type="submit" value="Total" id="button1">
    </div>
    <script>
        const form=document.getElementById("form");
        const list=document.getElementById("data");
        let sum=0;
        form.addEventListener('submit',function(event){
            event.preventDefault();
            const desc=document.getElementById("desc").value;
            const cat=document.getElementById("cateogary").value;
            const amount=document.getElementById("amount").value;
            sum+=parseFloat(amount);
            if(desc && cat && !isNaN(amount)){
                const newr=document.createElement('tr');
                newr.innerHTML=`<td>${desc}</td>
                <td>${cat}</td>
                <td>${amount}</td>`;
                list.appendChild(newr);
            }
            document.getElementById("desc").value='';
            document.getElementById("cateogary").value='';
            document.getElementById("amount").value="";
        });
        
        const total=document.getElementById("button1");
        total.addEventListener('click',function(event){
            alert("Your total amount is "+sum);
        });
    </script>
</body>
</html>
